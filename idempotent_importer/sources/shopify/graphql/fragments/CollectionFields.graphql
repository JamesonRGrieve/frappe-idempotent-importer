fragment CollectionFields on Collection {
  id
  legacyResourceId
  handle
  title
  descriptionHtml
  sortOrder
  templateSuffix
  updatedAt
  image {
    ...ImageFields
  }
  seo {
    ...SeoFields
  }
  ruleSet {
    appliedDisjunctively
    rules {
      column
      relation
      condition
      conditionObject {
        __typename
        ... on CollectionRuleMetafieldCondition {
          metafieldDefinition {
            namespace
            key
          }
        }
      }
    }
  }
  metafields(first: $metafieldsFirst) {
    ...MetafieldConnectionFields
  }
}
