fragment DiscountItemsFields on DiscountItems {
  __typename
  ... on DiscountProducts {
    products(first: 250) {
      pageInfo {
        ...PageInfoFields
      }
      nodes {
        id
      }
    }
    productVariants(first: 250) {
      pageInfo {
        ...PageInfoFields
      }
      nodes {
        id
      }
    }
  }
  ... on DiscountCollections {
    collections(first: 250) {
      pageInfo {
        ...PageInfoFields
      }
      nodes {
        id
      }
    }
  }
}
