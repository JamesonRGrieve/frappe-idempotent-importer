# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: scripts/check.sh
  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: The apps the bench installs beside this one
        run: |
          git clone --branch version-16 https://github.com/JamesonRGrieve/frappe-webshop ../frappe-webshop
          git -C ../frappe-webshop checkout --quiet "$WEBSHOP_REF"
          git clone https://github.com/JamesonRGrieve/frappe-public-site-router ../frappe-public-site-router
        env:
          # The Webshop fork's store-scoped coupon codes (Coupon Code.webshop_store) and the discount limits it
          # enforces (card 405: per-customer limits, eligibility, shipping discounts; card 407: rule eligibility
          # and discount limits), which the importer writes.
          WEBSHOP_REF: 53156e382c
      - run: tests/e2e/run.sh
